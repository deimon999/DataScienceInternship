version: '3.8'

services:
  api:
    build: .
    container_name: house_price_api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./data:/app/data
    command: python -m uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app-network

  frontend:
    image: nginx:alpine
    container_name: house_price_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
